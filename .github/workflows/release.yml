name: Release

# Run from the Actions tab to publish a release: the version is the UTC
# release date (CalVer YYYY.MM.DD, with a .N suffix for repeated same-day
# releases), and the tag, GitHub release and release notes are all created
# by this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    # Releases come from master only; build and publish are skipped with this job
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so existing tags are visible to the version check.
          fetch-depth: 0

      - name: Compute CalVer version
        id: calver
        run: |
          base=$(date -u +%Y.%m.%d)
          version=$base
          n=1
          while [ -n "$(git tag --list "v$version")" ]; do
            n=$((n + 1))
            version="$base.$n"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing as v$version"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: true
    runs-on: ${{ matrix.os }}
    env:
      STATUSLINE_VERSION: ${{ needs.version.outputs.version }}
      ARCHIVE: claude-code-statusline-${{ needs.version.outputs.version }}-${{ matrix.target }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Tests run against the shipped target (so the musl build is tested too),
      # except the x86_64 macOS one, which is cross-compiled on an arm64 runner
      # and can only be tested for the runner's own target.
      - name: Run tests
        if: ${{ !matrix.cross }}
        run: cargo test --locked --target "$TARGET"
        shell: bash

      - name: Run tests (runner target)
        if: ${{ matrix.cross }}
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked --target "$TARGET"
        shell: bash

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Compress-Archive -Path "target/$env:TARGET/release/claude-code-statusline.exe", README.md, LICENSE -DestinationPath "out/$env:ARCHIVE.zip"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir out
          tar -czf "out/$ARCHIVE.tar.gz" -C "target/$TARGET/release" claude-code-statusline -C "$GITHUB_WORKSPACE" README.md LICENSE

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Create GitHub release
        working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sha256sum * > SHA256SUMS.txt
          gh release create "v$VERSION" * \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "claude-code-statusline $VERSION" \
            --generate-notes
